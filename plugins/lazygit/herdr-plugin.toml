# herdr-plugin.toml — manifest for the lazygit plugin.
#
# Opens lazygit (https://github.com/jesseduffield/lazygit) — a terminal UI for
# git — in its own herdr tab. Summoned ONLY by an explicit action/keybinding —
# no event hooks, nothing automatic. The viewer is transient: quitting lazygit
# (`q`) exits the process so the tab disappears with it.
#
# One instance per workspace, idempotent toggle (see scripts/launch.sh):
#   no lazygit tab in this workspace -> open one (focused)
#   local lazygit tab, not focused   -> switch to it
#   already on the local lazygit tab -> close it (toggle off)

id = "lazygit"
name = "lazygit"
version = "0.1.0"
description = "Open lazygit in a workspace-local tab or a transient popup."
min_herdr_version = "0.7.4"
platforms = ["linux", "macos"]

# The tab entrypoint is the pane label that the launcher uses for its
# workspace-local idempotent toggle.
#
# The pane command is a path relative to the plugin root (the new pane's default
# cwd), so the launcher passes the repo to open via `--env HERDR_LAZYGIT_REPO`
# rather than `--cwd` (which would change where this relative path resolves).
[[panes]]
id = "lazygit"
title = "lazygit"
placement = "tab"
command = ["bash", "scripts/lazygit.sh"]

# The popup entrypoint is intentionally separate: popups are session-modal and
# do not participate in the tab toggle's pane lookup.
[[panes]]
id = "lazygit-popup"
title = "lazygit"
placement = "popup"
width = "90%"
height = "90%"
command = ["bash", "scripts/lazygit.sh"]

[[actions]]
id = "toggle"
title = "lazygit (tab)"
description = "Open lazygit in its own tab; focus it if it exists in this workspace; close it if already focused."
command = ["bash", "scripts/launch.sh", "tab"]

[[actions]]
id = "popup"
title = "lazygit (popup)"
description = "Open a transient modal lazygit session without changing the tab layout."
command = ["bash", "scripts/launch.sh", "popup"]
