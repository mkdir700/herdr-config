# Open a fresh coding-agent tab in the focused pane's working directory.
id = "agent-launcher"
name = "Agent Launcher"
version = "0.2.0"
description = "Start Codex, Claude Code, or Pi in a new Herdr tab."
min_herdr_version = "0.7.4"
platforms = ["linux", "macos"]

[[panes]]
id = "agent-picker"
title = "Choose coding agent"
placement = "popup"
width = "60%"
height = 12
command = ["bash", "scripts/pick-agent.sh"]

[[panes]]
id = "agent-codex"
title = "Codex"
placement = "tab"
command = ["bash", "scripts/run-agent.sh", "codex"]

[[panes]]
id = "agent-claude"
title = "Claude"
placement = "tab"
command = ["bash", "scripts/run-agent.sh", "claude"]

[[panes]]
id = "agent-pi"
title = "Pi"
placement = "tab"
command = ["bash", "scripts/run-agent.sh", "pi"]

[[actions]]
id = "launch"
title = "Choose coding agent"
description = "Choose Codex, Claude Code, or Pi, then open it in a new tab at the focused pane's working directory."
command = ["bash", "scripts/open-picker.sh"]
